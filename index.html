<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>911 Hub</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0b0b11;color:#f5f5f7}
header{position:sticky;top:0;z-index:2;background:rgba(10,10,14,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
.headerInner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:-.3px}
main{max-width:1100px;margin:0 auto;padding:22px 16px 44px}
.section{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.03);padding:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
select{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.2);color:#f5f5f7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.grid{grid-template-columns:1fr}}
.card{border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);padding:14px}
.card h3{margin:0 0 6px 0;font-size:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.8)}
.specRow{display:flex;justify-content:space-between;color:rgba(255,255,255,.78);font-size:13px}
.footer{margin-top:16px;color:rgba(255,255,255,.7);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="headerInner">
    <div class="brand">911 Hub</div>
    <div>Quick catalog of 911 models</div>
  </div>
</header>

<main>
  <section class="section">
    <h2>Model catalog</h2>
    <p>Filter by body style and tier.</p>

    <div class="filters">
      <label>
        Body
        <select id="fBody">
          <option value="">All</option>
          <option value="Coupe">Coupe</option>
          <option value="Cabriolet">Cabriolet</option>
          <option value="Targa">Targa</option>
        </select>
      </label>
      <label>
        Tier
        <select id="fTier">
          <option value="">All</option>
          <option value="Carrera">Carrera</option>
          <option value="GTS">GTS</option>
          <option value="Turbo">Turbo</option>
          <option value="GT">GT</option>
        </select>
      </label>
    </div>

    <div id="grid" class="grid"></div>

    <div class="footer">
      Data is a demo for a hobby site (not official).</div>
  </section>
</main>

<script>
const models=[
 {name:'911 Carrera',tier:'Carrera',body:'Coupe',drive:'RWD',pwr:'394 hp',zeroTo60:'3.9 s'},
 {name:'911 Carrera 4',tier:'Carrera',body:'Coupe',drive:'AWD',pwr:'394 hp',zeroTo60:'3.8 s'},
 {name:'911 Carrera S',tier:'Carrera',body:'Coupe',drive:'RWD',pwr:'480 hp',zeroTo60:'3.3 s'},
 {name:'911 Carrera 4S',tier:'Carrera',body:'Coupe',drive:'AWD',pwr:'480 hp',zeroTo60:'3.3 s'},
 {name:'911 Carrera GTS',tier:'GTS',body:'Coupe',drive:'RWD',pwr:'532 hp',zeroTo60:'2.9 s'},
 {name:'911 Carrera 4 GTS',tier:'GTS',body:'Coupe',drive:'AWD',pwr:'532 hp',zeroTo60:'2.9 s'},
 {name:'911 Targa 4',tier:'Carrera',body:'Targa',drive:'AWD',pwr:'394 hp',zeroTo60:'4.0 s'},
 {name:'911 Targa 4S',tier:'Carrera',body:'Targa',drive:'AWD',pwr:'480 hp',zeroTo60:'3.6 s'},
 {name:'911 Turbo',tier:'Turbo',body:'Coupe',drive:'AWD',pwr:'572 hp',zeroTo60:'2.7 s'},
 {name:'911 Turbo S',tier:'Turbo',body:'Coupe',drive:'AWD',pwr:'641 hp',zeroTo60:'2.6 s'},
 {name:'911 GT3',tier:'GT',body:'Coupe',drive:'RWD',pwr:'502 hp',zeroTo60:'3.2 s'}
];

function render(list){
 const el=document.getElementById('grid');
 el.innerHTML='';
 list.forEach(m=>{
   const card=document.createElement('div');
   card.className='card';
   card.innerHTML=`<h3>${m.name}</h3>
     <div class="badges">
       <span class="badge">${m.body}</span>
       <span class="badge">${m.drive}</span>
       <span class="badge">${m.tier}</span>
     </div>
     <div class="specRow"><span>Power</span><span>${m.pwr}</span></div>
     <div class="specRow"><span>0-60</span><span>${m.zeroTo60}</span></div>`;
   el.appendChild(card);
 });
}

function applyFilters(){
 const body=document.getElementById('fBody').value;
 const tier=document.getElementById('fTier').value;
 const filtered=models.filter(m=>
   (body===''||m.body===body)&&
   (tier===''||m.tier===tier)
 );
 render(filtered);
}

['fBody','fTier'].forEach(id=>{
 document.getElementById(id).addEventListener('change',applyFilters);
});

render(models);
</script>
</body>
</html>
